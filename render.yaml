services:
  - type: web
    name: laravel-gym-system-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: marvin-demo-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: APP_KEY
        sync: false
      - key: GYM_ADMIN_EMAIL
        sync: false
      - key: GYM_ADMIN_PASSWORD
        sync: false

databases:
  - name: marvin-demo-db
    databaseName: marvin
    user: marvin
    plan: free
    region: singapore
